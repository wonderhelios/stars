<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKX Quant</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #7d8590;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }
  .tab {
    padding: 12px 16px;
    cursor: pointer;
    color: var(--dim);
    font-size: 13px;
    border-bottom: 2px solid transparent;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  /* Header 区域 */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }
  header .stats {
    color: var(--dim);
    font-size: 12px;
  }
  header .stats b { color: var(--text); }
  header input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    width: 200px;
    outline: none;
  }
  header input:focus { border-color: var(--accent); }
  header .toggle {
    margin-left: auto;
    color: var(--dim);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  header .toggle input { vertical-align: middle; margin-right: 4px; }

  /* 表格 */
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky;
    top: 53px;
    background: var(--panel);
    text-align: right;
    padding: 8px 12px;
    font-weight: 500;
    color: var(--dim);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:first-child,
  tbody td:first-child { text-align: left; }
  thead th:hover { color: var(--text); }
  thead th.sorted::after {
    content: " ▾";
    color: var(--accent);
  }
  thead th.sorted.asc::after { content: " ▴"; }

  tbody td {
    padding: 6px 12px;
    text-align: right;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
  }
  tbody tr:hover { background: #1c2128; }
  tbody tr.hot { background: rgba(210, 153, 34, 0.08); }

  .sym { color: var(--text); font-weight: 500; }
  .sym .base { color: var(--accent); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .dim { color: var(--dim); }

  #loading {
    text-align: center;
    padding: 60px;
    color: var(--dim);
  }
  footer {
    padding: 12px 20px;
    color: var(--dim);
    font-size: 11px;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  /* Paper 页面 */
  .paper-wrap { padding: 20px; }
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h3 {
    margin: 0 0 10px 0;
    font-size: 13px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
  }
  .card h3 .n { color: var(--dim); font-weight: 400; font-size: 11px; }
  .card .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 12px;
    color: var(--dim);
  }
  .card .row .val { color: var(--text); }
  .card .row .val.pos { color: var(--green); }
  .card .row .val.neg { color: var(--red); }

  .empty-tip {
    text-align: center;
    padding: 40px;
    color: var(--dim);
    font-size: 13px;
  }

  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    color: #fff;
  }
  .badge.pump_pos_fund { background: #a22020; }
  .badge.crash_pos_fund { background: #7a4a00; }
  .badge.up_pos_fund { background: #1f6f43; }
  .badge.down_pos_fund { background: #385a7a; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-page="market">实时行情</div>
  <div class="tab" data-page="paper">纸上交易</div>
</div>

<!-- 实时行情页面 -->
<div id="page-market">
  <header>
    <h1>OKX SWAP Monitor</h1>
    <div class="stats">
      <b id="count">0</b> instruments · 最后更新 <b id="updated">-</b>
    </div>
    <input id="search" type="text" placeholder="搜索 instId / BASE ...">
    <label class="toggle">
      <input id="onlyHot" type="checkbox"> 只看极端费率
    </label>
  </header>

  <div id="loading">正在连接服务器...</div>

  <table id="table" style="display:none">
    <thead>
      <tr>
        <th data-key="inst_id">Symbol</th>
        <th data-key="last">Last</th>
        <th data-key="change">24h%</th>
        <th data-key="volume_quote_24h">24h Vol (USDT)</th>
        <th data-key="funding_rate">Funding</th>
        <th data-key="next_funding_time">Next Fund</th>
        <th data-key="ts">Updated</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- 纸上交易页面 -->
<div id="page-paper" style="display:none">
  <div class="paper-wrap">
    <div class="stat-cards" id="stat-cards"></div>
    <div id="paper-loading" class="empty-tip">正在加载信号数据...</div>
    <table id="paper-table" style="display:none">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>信号类型</th>
          <th>触发时间</th>
          <th>入场价</th>
          <th>Funding</th>
          <th>前24h</th>
          <th>T+1h 净%</th>
          <th>T+4h 净%</th>
          <th>T+8h 净%</th>
          <th>T+24h 净%</th>
        </tr>
      </thead>
      <tbody id="paper-tbody"></tbody>
    </table>
  </div>
</div>

<footer>
  数据源 OKX v5 · 信号阈值 funding &gt; 0.05% · 成本假设 0.15%
</footer>

<script>
const COST = 0.15;

// ===== Tab 切换 =====
document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    t.classList.add("active");
    const page = t.dataset.page;
    document.getElementById("page-market").style.display = page === "market" ? "" : "none";
    document.getElementById("page-paper").style.display = page === "paper" ? "" : "none";
    if (page === "paper") fetchPaper();
  });
});

// ===== 实时行情 =====
const API_SNAPSHOT = "/api/snapshot";
const REFRESH_MS = 3000;
const EXTREME = 0.0005;

let sortKey = "volume_quote_24h";
let sortAsc = false;
let rows = [];

const $tbody = document.getElementById("tbody");
const $table = document.getElementById("table");
const $loading = document.getElementById("loading");
const $count = document.getElementById("count");
const $updated = document.getElementById("updated");
const $search = document.getElementById("search");
const $onlyHot = document.getElementById("onlyHot");

function fmtPrice(s) {
  if (!s) return "-";
  const n = parseFloat(s);
  if (!isFinite(n) || n === 0) return "0";
  const a = Math.abs(n);
  if (a >= 1000) return n.toFixed(2);
  if (a >= 1) return n.toFixed(4);
  if (a >= 0.01) return n.toFixed(6);
  if (a >= 0.0001) return n.toFixed(8);
  return n.toFixed(12);
}

function fmtVol(s) {
  const n = parseFloat(s);
  if (!isFinite(n)) return "-";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";
  return n.toFixed(2);
}

function fmtPct(x) {
  if (!isFinite(x)) return "-";
  const s = x >= 0 ? "+" : "";
  return s + x.toFixed(2) + "%";
}

function fmtFunding(s) {
  if (s === null || s === undefined) return "-";
  const n = parseFloat(s);
  if (!isFinite(n)) return "-";
  return (n * 100).toFixed(4) + "%";
}

function fmtNextFunding(ts) {
  if (!ts) return "-";
  const diff = ts - Date.now();
  if (diff <= 0) return "结算中";
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `${h}h ${m}m`;
}

function fmtTime(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const pad = (n) => n.toString().padStart(2, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function changePct(last, open) {
  const l = parseFloat(last);
  const o = parseFloat(open);
  if (!isFinite(l) || !isFinite(o) || o === 0) return 0;
  return (l - o) / o * 100;
}

function compare(a, b, key) {
  const getVal = (r) => {
    if (key === "change") return changePct(r.last, r.open_24h);
    if (key === "funding_rate") return r.funding_rate ? parseFloat(r.funding_rate) : -Infinity;
    const v = r[key];
    if (v === null || v === undefined) return -Infinity;
    const n = parseFloat(v);
    return isFinite(n) ? n : -Infinity;
  };
  const va = getVal(a);
  const vb = getVal(b);
  if (va === vb) return 0;
  return va > vb ? 1 : -1;
}

function renderMarket() {
  const q = $search.value.trim().toUpperCase();
  const onlyHot = $onlyHot.checked;

  let data = rows.filter((r) => {
    if (q && !r.inst_id.toUpperCase().includes(q) &&
        !r.base.toUpperCase().includes(q)) return false;
    if (onlyHot) {
      const fr = r.funding_rate ? Math.abs(parseFloat(r.funding_rate)) : 0;
      if (fr < EXTREME) return false;
    }
    return true;
  });

  data.sort((a, b) => (sortAsc ? 1 : -1) * compare(a, b, sortKey));

  const frag = document.createDocumentFragment();
  for (const r of data) {
    const tr = document.createElement("tr");
    const chg = changePct(r.last, r.open_24h);
    const fr = r.funding_rate ? parseFloat(r.funding_rate) : null;
    const isHot = fr !== null && Math.abs(fr) >= EXTREME;
    if (isHot) tr.classList.add("hot");

    tr.innerHTML = `
      <td class="sym"><span class="base">${r.base}</span>/${r.quote}</td>
      <td>${fmtPrice(r.last)}</td>
      <td class="${chg >= 0 ? "pos" : "neg"}">${fmtPct(chg)}</td>
      <td>${fmtVol(r.volume_quote_24h)}</td>
      <td class="${fr === null ? "dim" : fr >= 0 ? "neg" : "pos"}">
        ${fmtFunding(r.funding_rate)}
      </td>
      <td class="dim">${fmtNextFunding(r.next_funding_time)}</td>
      <td class="dim">${fmtTime(r.ts)}</td>
    `;
    frag.appendChild(tr);
  }

  $tbody.replaceChildren(frag);
  $count.textContent = data.length;

  const now = new Date();
  const pad = (n) => n.toString().padStart(2, "0");
  $updated.textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

async function fetchMarket() {
  try {
    const r = await fetch(API_SNAPSHOT, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    rows = await r.json();
    $loading.style.display = "none";
    $table.style.display = "";
    renderMarket();
  } catch (e) {
    console.error(e);
    $loading.textContent = "连接失败: " + e.message;
    $loading.style.display = "block";
    $table.style.display = "none";
  }
}

document.querySelectorAll("thead th").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (!key) return;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = false;
    }
    document.querySelectorAll("thead th").forEach((h) => h.classList.remove("sorted", "asc"));
    th.classList.add("sorted");
    if (sortAsc) th.classList.add("asc");
    renderMarket();
  });
});
document.querySelector(`thead th[data-key="${sortKey}"]`).classList.add("sorted");

$search.addEventListener("input", renderMarket);
$onlyHot.addEventListener("change", renderMarket);

// ===== 纸上交易 =====
const API_PAPER = "/api/paper/signals";
const PAPER_REFRESH_MS = 5000;

const kindLabels = {
  crash_pos_fund: "暴跌+正费率",
  down_pos_fund: "下跌+正费率",
  up_pos_fund: "上涨+正费率",
  pump_pos_fund: "暴涨+正费率",
};

function fmtAgo(ts) {
  const diff = Date.now() - ts;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 24) return `${Math.floor(h / 24)}d ${h % 24}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function fmtDateTime(ts) {
  const d = new Date(ts);
  const pad = (n) => n.toString().padStart(2, "0");
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 计算某个信号的 T+h 净收益（做空）
function netReturn(entry, price) {
  if (!price || !entry) return null;
  const e = parseFloat(entry);
  const p = parseFloat(price);
  if (!isFinite(e) || !isFinite(p) || e === 0) return null;
  const raw = (p - e) / e * 100;
  return -raw - COST;
}

function renderPaper(signals) {
  const $cards = document.getElementById("stat-cards");
  const $paperTbody = document.getElementById("paper-tbody");
  const $paperTable = document.getElementById("paper-table");
  const $paperLoading = document.getElementById("paper-loading");

  if (!signals || signals.length === 0) {
    $paperLoading.textContent = "暂无信号记录。系统每 5 分钟扫描一次，抓到信号会记录在这里。";
    $paperLoading.style.display = "block";
    $paperTable.style.display = "none";
    $cards.innerHTML = "";
    return;
  }

  $paperLoading.style.display = "none";
  $paperTable.style.display = "";

  // 按 kind 分组统计
  const groups = {};
  for (const s of signals) {
    if (!groups[s.kind]) groups[s.kind] = [];
    groups[s.kind].push(s);
  }

  const horizons = [
    ["t1_price", "T+1h"],
    ["t4_price", "T+4h"],
    ["t8_price", "T+8h"],
    ["t24_price", "T+24h"],
  ];

  let cardsHtml = "";
  for (const kind of ["pump_pos_fund", "crash_pos_fund", "up_pos_fund", "down_pos_fund"]) {
    const list = groups[kind];
    if (!list || list.length === 0) continue;
    cardsHtml += `<div class="card">
      <h3>${kindLabels[kind] || kind} <span class="n">n=${list.length}</span></h3>`;

    for (const [field, label] of horizons) {
      const nets = [];
      for (const s of list) {
        const r = netReturn(s.entry_price, s[field]);
        if (r !== null) nets.push(r);
      }
      if (nets.length === 0) {
        cardsHtml += `<div class="row"><span>${label}</span><span class="val">—</span></div>`;
        continue;
      }
      const avg = nets.reduce((a, b) => a + b, 0) / nets.length;
      const wins = nets.filter((x) => x > 0).length;
      const wr = wins / nets.length * 100;
      const cls = avg >= 0 ? "pos" : "neg";
      cardsHtml += `<div class="row">
        <span>${label}</span>
        <span class="val ${cls}">${avg >= 0 ? "+" : ""}${avg.toFixed(2)}% · ${wr.toFixed(0)}% · n=${nets.length}</span>
      </div>`;
    }
    cardsHtml += "</div>";
  }
  $cards.innerHTML = cardsHtml || `<div class="empty-tip">还没有完成的信号</div>`;

  // 信号表格（按时间倒序）
  const sorted = [...signals].sort((a, b) => b.triggered_at - a.triggered_at);
  const frag = document.createDocumentFragment();
  for (const s of sorted) {
    const tr = document.createElement("tr");
    const fr = parseFloat(s.funding_rate);
    const prior = parseFloat(s.prior_24h_return);

    const cells = [];
    cells.push(`<td class="sym">${s.inst_id.replace("-USDT-SWAP", "")}</td>`);
    cells.push(`<td><span class="badge ${s.kind}">${kindLabels[s.kind] || s.kind}</span></td>`);
    cells.push(`<td class="dim" title="${fmtDateTime(s.triggered_at)}">${fmtAgo(s.triggered_at)}前</td>`);
    cells.push(`<td>${fmtPrice(s.entry_price)}</td>`);
    cells.push(`<td class="${fr >= 0 ? "neg" : "pos"}">${(fr * 100).toFixed(4)}%</td>`);
    cells.push(`<td class="${prior >= 0 ? "pos" : "neg"}">${prior >= 0 ? "+" : ""}${prior.toFixed(2)}%</td>`);

    for (const [field] of horizons) {
      const r = netReturn(s.entry_price, s[field]);
      if (r === null) {
        cells.push(`<td class="dim">—</td>`);
      } else {
        const cls = r >= 0 ? "pos" : "neg";
        cells.push(`<td class="${cls}">${r >= 0 ? "+" : ""}${r.toFixed(2)}%</td>`);
      }
    }

    tr.innerHTML = cells.join("");
    frag.appendChild(tr);
  }
  $paperTbody.replaceChildren(frag);
}

async function fetchPaper() {
  try {
    const r = await fetch(API_PAPER, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const signals = await r.json();
    renderPaper(signals);
  } catch (e) {
    console.error(e);
    document.getElementById("paper-loading").textContent = "连接失败: " + e.message;
  }
}

// ===== 启动 =====
fetchMarket();
setInterval(fetchMarket, REFRESH_MS);
setInterval(() => {
  if (document.getElementById("page-paper").style.display !== "none") {
    fetchPaper();
  }
}, PAPER_REFRESH_MS);
</script>
</body>
</html>
