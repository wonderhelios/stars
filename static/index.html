<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>STARS · Quant Terminal</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div class="brand-name">STARS</div>
          <span class="brand-tag">TERMINAL</span>
        </div>

        <nav class="nav-section" aria-label="主力系统">
          <div class="nav-label">CORE</div>
          <button type="button" class="nav-btn active" data-route="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
            <span>总览</span>
          </button>
          <button type="button" class="nav-btn" data-route="live">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 9-9"/><path d="M15 6h6v6"/></svg>
            <span>实盘</span>
            <span class="nav-dot" id="dot-live"></span>
          </button>
          <button type="button" class="nav-btn" data-route="limitoco">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2.5"/></svg>
            <span>限价 V2</span>
            <span class="nav-dot" id="dot-limitoco"></span>
          </button>
        </nav>

        <nav class="nav-section" aria-label="归档">
          <button type="button" class="nav-toggle" id="nav-archive-toggle" aria-expanded="false">
            <span>归档 (4)</span>
            <span class="chev">▸</span>
          </button>
          <div id="nav-archive-list" hidden>
            <button type="button" class="nav-btn nav-sub" data-route="archive/hlcarry"><span>基差影子</span></button>
            <button type="button" class="nav-btn nav-sub" data-route="archive/intraday"><span>日内影子</span></button>
            <button type="button" class="nav-btn nav-sub" data-route="archive/tradfi"><span>美股商品</span></button>
            <button type="button" class="nav-btn nav-sub" data-route="archive/fastswing"><span>快速波段</span></button>
          </div>
        </nav>

        <div class="sidebar-foot">
          <div class="sidebar-foot-row"><span>更新</span><span id="foot-updated">—</span></div>
          <div class="sidebar-foot-row">
            <span>鉴权</span>
            <button type="button" class="btn ghost sm" id="btn-auth-open" style="height:22px;padding:0 6px">令牌</button>
          </div>
        </div>
      </aside>

      <div class="main-col">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="mobile-menu-btn" id="btn-mobile-menu" aria-label="菜单">☰</button>
            <span class="crumb-title" id="crumb-title">总览</span>
            <span class="crumb-meta" id="crumb-meta"></span>
          </div>
          <div class="topbar-right">
            <span class="pill" id="top-health-pill" hidden></span>
            <button type="button" class="btn sm" id="btn-global-refresh">刷新</button>
          </div>
        </header>

        <main class="workspace" id="workspace"></main>
      </div>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="底部导航">
      <button type="button" class="mobile-nav-btn active" data-route="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
        <span>总览</span>
      </button>
      <button type="button" class="mobile-nav-btn" data-route="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 9-9"/><path d="M15 6h6v6"/></svg>
        <span>实盘</span>
      </button>
      <button type="button" class="mobile-nav-btn" data-route="limitoco">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2.5"/></svg>
        <span>限价 V2</span>
      </button>
      <button type="button" class="mobile-nav-btn" id="btn-mobile-more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>更多</span>
      </button>
    </nav>

    <div id="auth-overlay" class="auth-overlay" hidden>
      <div class="auth-card">
        <h3>访问鉴权</h3>
        <p>请输入 <code>STARS_TOKEN</code> 访问令牌。</p>
        <input id="auth-token" type="password" placeholder="Bearer Token" autocomplete="current-password" />
        <button class="btn primary" id="auth-submit" type="button" style="height:38px">验证并进入</button>
        <p id="auth-status" class="warn"></p>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
